<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress | CHEM & GO</title>
    <link rel="stylesheet" href="css/home.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        .stat-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,.08);
            text-align: center;
        }
        .stat-card h4 {
            margin-bottom: 10px;
            color: #0B2A66;
        }
        .stat-card p {
            font-size: 28px;
            font-weight: 700;
            color: #49B36B;
        }
    </style>
</head>

<body>

    <header class="header" style="padding-bottom: 20px; text-align: center;">
        <h1 style="color: white; font-size: 24px;">Your Progress</h1>
    </header>

    <main class="section" style="padding-bottom: 80px;">
        <div class="stat-card">
            <h4>Missions Completed</h4>
            <p id="progress-missions">0/6</p>
        </div>
        <div class="stat-card">
            <h4>Total XP Earned</h4>
            <p id="progress-xp">0</p>
        </div>
        <div class="stat-card">
            <h4>Badges Collected</h4>
            <p id="progress-badges">0</p>
        </div>
    </main>

    <!-- ================= BOTTOM NAVIGATION ================= -->

    <nav class="bottom-nav">

        <div class="nav-item" data-page="home">
            <i class="fa-solid fa-house"></i>
            Home
        </div>

        <div class="nav-item" data-page="missions">
            <i class="fa-solid fa-book-open"></i>
            Missions
        </div>

        <div class="nav-item active" data-page="progress">
            <i class="fa-solid fa-chart-line"></i>
            Progress
        </div>

        <div class="nav-item" data-page="resources">
            <i class="fa-solid fa-flask"></i>
            Resources
        </div>

        <div class="nav-item" data-page="about">
            <i class="fa-solid fa-circle-info"></i>
            About
        </div>

    </nav>

    <script src="js/progress.js"></script> <!-- For progress display logic -->
    <script src="js/navigation.js"></script>

</body>

</html>
